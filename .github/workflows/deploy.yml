name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # base_path vale "/serbar-react" per la preview su github.io e "" quando
      # il custom domain (serbar.it) e' attivo: Vite vuole pero' lo slash finale.
      - name: Set BASE_PATH
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PAGES_BASE:-/}"
          [ "$base" = "/" ] || base="${base%/}/"
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Vite base: $base"

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      # GitHub Pages non ha rewrite lato server: 404.html serve la stessa SPA
      # così /mypage funziona anche su refresh o link diretto.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
